AWSTemplateFormatVersion: '2010-09-09'
Description: GatherQuiz ZIP Lambda and private Single-AZ PostgreSQL without NAT
Parameters:
  ArtifactBucket: { Type: String }
  CodeKey: { Type: String }
  DbPassword: { Type: String, NoEcho: true }
  AppPassword: { Type: String, NoEcho: true }
  DomainName: { Type: String }
  CertificateArn: { Type: String }
  HostedZoneId: { Type: String }
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  RouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref Routes }
  RouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref Routes }
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref Routes]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub '${Backups.Arn}/*'
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GatherQuiz Lambda outbound access
      VpcId: !Ref Vpc
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts only GatherQuiz Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: GatherQuiz isolated subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-db'
      Engine: postgres
      EngineVersion: '17'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: gatherquiz
      MasterUsername: gatherquiz_admin
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
  Frontend:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  Uploads:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: [!Sub 'https://${DomainName}']
            ExposedHeaders: [ETag]
      LifecycleConfiguration:
        Rules:
          - Id: OldVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackups
            Status: Enabled
            ExpirationInDays: 30
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: UploadImages
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${Uploads.Arn}/uploads/*'
  MaintenanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DatabaseBackups
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${Backups.Arn}/backups/*'
  BackendLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7
  MaintenanceLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-db'
      RetentionInDays: 7
  Backend:
    Type: AWS::Lambda::Function
    DependsOn: BackendLog
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: lambda.handler
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt BackendRole.Arn
      MemorySize: 256
      Timeout: 28
      VpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_USER: gatherquiz_app
          DB_PASSWORD: !Ref AppPassword
          IMAGE_UPLOAD_BUCKET_NAME: !Ref Uploads
          IMAGE_PUBLIC_BASE_URL: !Sub 'https://${DomainName}'
  Maintenance:
    Type: AWS::Lambda::Function
    DependsOn: MaintenanceLog
    Properties:
      FunctionName: !Sub '${AWS::StackName}-db'
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: maintenance.handler
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt MaintenanceRole.Arn
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_USER: gatherquiz_admin
          DB_PASSWORD: !Ref DbPassword
          DB_APP_PASSWORD: !Ref AppPassword
          BACKUP_BUCKET: !Ref Backups
          STACK_NAME: !Ref AWS::StackName
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties: { Name: !Sub '${AWS::StackName}-api', ProtocolType: HTTP }
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Backend.Arn
      PayloadFormatVersion: '2.0'
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Backend
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa'
      AutoPublish: true
      FunctionConfig: { Comment: Rewrite only GatherQuiz routes, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (['/', '/terms', '/privacy', '/contact'].indexOf(request.uri) !== -1 || request.uri === '/gather' || request.uri.startsWith('/gather/')) {
            request.uri = '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: frontend
            DomainName: !GetAtt Frontend.RegionalDomainName
            OriginAccessControlId: !Ref Oac
            S3OriginConfig: {}
          - Id: uploads
            DomainName: !GetAtt Uploads.RegionalDomainName
            OriginAccessControlId: !Ref Oac
            S3OriginConfig: {}
          - Id: api
            DomainName: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: { OriginProtocolPolicy: https-only, HTTPSPort: 443 }
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues: { QueryString: false, Cookies: { Forward: none } }
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 31536000
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: '/uploads/*'
            TargetOriginId: uploads
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
  FrontendPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Frontend
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Frontend.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  UploadsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Uploads
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Uploads.Arn}/uploads/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Dns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
Outputs:
  Url: { Value: !Sub 'https://${DomainName}' }
  FrontendBucket: { Value: !Ref Frontend }
  UploadBucket: { Value: !Ref Uploads }
  BackupBucket: { Value: !Ref Backups }
  DistributionId: { Value: !Ref Distribution }
  BackendFunction: { Value: !Ref Backend }
  MaintenanceFunction: { Value: !Ref Maintenance }
  DatabaseId: { Value: !Ref Database }
