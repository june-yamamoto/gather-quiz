AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for GatherQuiz Backend (App Runner)

Parameters:
  DbUser:
    Type: String
    Description: The master username for the RDS database
    NoEcho: true
  DbPassword:
    Type: String
    Description: The master password for the RDS database
    NoEcho: true
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: A list of private subnet IDs for the App Runner service
  AppRunnerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The security group ID for the App Runner service
  EcrRepositoryUri:
    Type: String
    Description: The URI of the ECR repository for the backend image
  RdsStackName:
    Type: String
    Description: The name of the RDS CloudFormation stack to import outputs from.

Resources:
  # App Runner VPC Connector
  AppRunnerVpcConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      VpcConnectorName: !Sub ${AWS::StackName}-vpc-connector
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups:
        - !Ref AppRunnerSecurityGroupId

  # IAM Role for App Runner to access ECR
  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-AppRunnerEcrAccessRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - tasks.apprunner.amazonaws.com
                - build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # IAM Role for App Runner instance (for VPC access)
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-AppRunnerInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole

  # App Runner Service
  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub ${AWS::StackName}-service
      SourceConfiguration:
        ImageRepository:
          ImageIdentifier: !Sub "${EcrRepositoryUri}:latest"
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000"
            RuntimeEnvironmentVariables:
              - Name: DATABASE_URL
                Value: !Sub
                  - "postgresql://${DbUser}:${DbPassword}@${DbEndpoint}:${DbPort}/gatherquiz?schema=public"
                  - DbEndpoint: !ImportValue
                      'Fn::Sub': '${RdsStackName}-DbEndpoint'
                    DbPort: !ImportValue
                      'Fn::Sub': '${RdsStackName}-DbPort'
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !Ref AppRunnerVpcConnector
      InstanceConfiguration:
        Cpu: 1024 # 1 vCPU
        Memory: 2048 # 2 GB
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: TCP

Outputs:
  AppRunnerServiceUrl:
    Description: The URL of the App Runner service
    Value: !GetAtt AppRunnerService.ServiceUrl
    Export:
      Name: !Sub ${AWS::StackName}-AppRunnerServiceUrl