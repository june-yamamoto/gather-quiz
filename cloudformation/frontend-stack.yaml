AWSTemplateFormatVersion: "2010-09-09"
Description: GatherQuizフロントエンド(S3とCloudFront)用CloudFormationテンプレート

Parameters:
  DomainName:
    Type: String
    Description: "CloudFrontディストリビューションのドメイン名 (例: gather-quiz.yourdomain.com)"
  SubdomainName:
    Type: String
    Description: "S3バケット名に使用するサブドメイン部分 (例: gather-quiz.yourdomain.com -> gather-quiz)"
  AcmCertificateArn:
    Type: String
    Description: ACM証明書のARN (us-east-1にある必要があります)
  ApiGatewayEndpoint:
    Type: String
    Description: API Gatewayのエンドポイント (https://なし)
  BasicAuthUser:
    Type: String
    Description: Basic認証のユーザー名
    NoEcho: true
  BasicAuthPass:
    Type: String
    Description: Basic認証のパスワード
    NoEcho: true

Resources:
  # S3 Bucket for Frontend Static Files
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${SubdomainName}-frontend-bucket
      AccessControl: Private
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendCloudFrontDistributionV2}"

  # CloudFront Origin Access Control (OAC)
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${SubdomainName}-oac-v2
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution for Frontend
  FrontendCloudFrontDistributionV2:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: CloudFront distribution for GatherQuiz frontend
        Enabled: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gateway-origin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400 # 24 hours
          MaxTTL: 31536000 # 1 year
        Origins:
          - Id: s3-origin
            DomainName: !Sub ${FrontendBucket}.s3.${AWS::Region}.amazonaws.com
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: api-gateway-origin
            DomainName: !Ref ApiGatewayEndpoint
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCachingMinTTL: 300
            ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCachingMinTTL: 300
            ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # CloudFront Function for Basic Authentication
  BasicAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-BasicAuth"
      AutoPublish: true
      FunctionConfig:
        Comment: "Basic authentication for the website"
        Runtime: cloudfront-js-1.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var headers = request.headers;
          var authUser = "${BasicAuthUser}";
          var authPass = "${BasicAuthPass}";

          // A simple Base64 encode function for CloudFront Functions
          var b64Encode = function(str) {
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
            var result = '';
            var i = 0;
            do {
              var a = str.charCodeAt(i++);
              var b = str.charCodeAt(i++);
              var c = str.charCodeAt(i++);
              a = a ? a : 0;
              b = b ? b : 0;
              c = c ? c : 0;

              var b1 = (a >> 2) & 0x3F;
              var b2 = ((a & 0x3) << 4) | ((b >> 4) & 0xF);
              var b3 = ((b & 0xF) << 2) | ((c >> 6) & 0x3);
              var b4 = c & 0x3F;

              if (!b) {
                b3 = b4 = 64;
              } else if (!c) {
                b4 = 64;
              }
              result += chars.charAt(b1) + chars.charAt(b2) + chars.charAt(b3) + chars.charAt(b4);
            } while (i < str.length);
            return result;
          };

          var authString = "Basic " + b64Encode(authUser + ":" + authPass);

          if (
            typeof headers.authorization === "undefined" ||
            headers.authorization.value !== authString
          ) {
            return {
              statusCode: 401,
              statusDescription: "Unauthorized",
              headers: {
                "www-authenticate": { value: 'Basic realm="Enter credentials"' },
              },
            };
          }
          return request;
        }

Outputs:
  FrontendBucketName:
    Description: フロントエンド用S3バケットの名前
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucketName
  CloudFrontDistributionId:
    Description: CloudFrontディストリビューションのID
    Value: !Ref FrontendCloudFrontDistributionV2
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId
  CloudFrontDomainName:
    Description: CloudFrontディストリビューションのドメイン名
    Value: !GetAtt FrontendCloudFrontDistributionV2.DomainName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDomainName