AWSTemplateFormatVersion: '2010-09-09'
Description: GatherQuiz画像アップロード用CloudFormationテンプレート(S3バケットとIAMロール)

Parameters:
  ProjectName:
    Type: String
    Description: "プロジェクト名 (例: GatherQuiz)"
  Environment:
    Type: String
    Description: "デプロイ環境 (例: dev, prod)"
  AllowedOrigin:
    Type: String
    Description: "CORSで許可するオリジン (例: https://example.com)"
    Default: "*"

Resources:
  # S3 Bucket for Image Uploads
  ImageUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-image-uploads
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false # ポリシーによる公開を許可
        IgnorePublicAcls: true
        RestrictPublicBuckets: false # 公開バケット制限を解除
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag

  # S3 Bucket Policy for Public Read Access
  ImageUploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageUploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImageUploadBucket}/*

  # IAM Policy for S3 Upload Access
  ImageUploadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 署名付きURL生成とS3 PUTアクセスを許可するポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImageUploadBucket}/*
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub arn:aws:s3:::${ImageUploadBucket}

  # IAM Role for Backend Service to Assume (e.g., Lambda)
  BackendServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ImageUploadPolicy

Outputs:
  ImageUploadBucketName:
    Description: 画像アップロード用S3バケットの名前
    Value: !Ref ImageUploadBucket
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ImageUploadBucketName
  BackendServiceRoleArn:
    Description: バックエンドサービス用IAMロールのARN
    Value: !GetAtt BackendServiceRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-BackendServiceRoleArn