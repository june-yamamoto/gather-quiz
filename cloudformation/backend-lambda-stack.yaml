AWSTemplateFormatVersion: '2010-09-09'
Description: GatherQuizバックエンド(Lambda + API Gateway)用CloudFormationテンプレート

Parameters:
  RdsStackName:
    Type: String
    Description: 出力をインポートするRDS CloudFormationスタックの名前
  EcrImageUri:
    Type: String
    Description: Lambda関数のECRイメージURI

Resources:
  # IAM Role for Lambda Execution
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue
                  'Fn::Sub': '${RdsStackName}-DbSecretArn'

  # Lambda Function from Container Image
  BackendLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-BackendLambda
      PackageType: Image
      Code:
        ImageUri: !Ref EcrImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          # DATABASE_URLはSecrets Managerから動的に構築するため削除
          # アプリケーションコード側でSECRET_IDを使って値を取得する必要がある
          SECRET_ID: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbSecretArn'
      Timeout: 60
      MemorySize: 1024

  # HTTP API Gateway
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-HttpApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*" # 本番環境では、フロントエンドのドメインのみに制限することを推奨
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  # API Gateway Integration with Lambda
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendLambda.Arn
      PayloadFormatVersion: '2.0'

  # API Gateway Default Route
  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Join
        - /
        - - integrations
          - !Ref HttpApiIntegration

  # API Gateway Stage
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # Permission for API Gateway to invoke Lambda
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiGatewayEndpoint:
    Description: API GatewayエンドポイントのURL
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-ApiGatewayEndpoint
