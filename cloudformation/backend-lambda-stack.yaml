AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for GatherQuiz Backend (Lambda + API Gateway)

Parameters:
  VpcStackName:
    Type: String
    Description: The name of the VPC CloudFormation stack to import outputs from.
  RdsStackName:
    Type: String
    Description: The name of the RDS CloudFormation stack to import outputs from.
  DbUser:
    Type: String
    Description: The master username for the RDS database.
    NoEcho: true
  DbPassword:
    Type: String
    Description: The master password for the RDS database.
    NoEcho: true
  EcrImageUri:
    Type: String
    Description: The URI of the ECR image for the Lambda function.

Resources:
  # IAM Role for Lambda Execution
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  # Lambda Function from Container Image
  BackendLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-BackendLambda
      PackageType: Image
      Code:
        ImageUri: !Ref EcrImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
              'Fn::Sub': '${VpcStackName}-LambdaSecurityGroupId'
        SubnetIds:
          'Fn::Split':
            - ','
            - !ImportValue
                'Fn::Sub': '${VpcStackName}-PrivateSubnetIds'
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql://${DbUser}:${DbPassword}@${DbEndpoint}:${DbPort}/gatherquiz?schema=public"
            - DbEndpoint: !ImportValue
                'Fn::Sub': '${RdsStackName}-DbEndpoint'
              DbPort: !ImportValue
                'Fn::Sub': '${RdsStackName}-DbPort'
      Timeout: 60
      MemorySize: 1024

  # HTTP API Gateway
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-HttpApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*" # In a real production environment, restrict this to the frontend domain
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  # API Gateway Integration with Lambda
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendLambda.Arn
      PayloadFormatVersion: '2.0'

  # API Gateway Default Route
  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Join
        - /
        - - integrations
          - !Ref HttpApiIntegration

  # API Gateway Stage
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # Permission for API Gateway to invoke Lambda
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiGatewayEndpoint:
    Description: The URL of the API Gateway endpoint
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-ApiGatewayEndpoint
