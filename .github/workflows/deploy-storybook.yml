name: Deploy Storybook to GitHub Pages

on:
  # mainブランチにプッシュされたときに実行
  push:
    branches: [ "main" ]
    paths: ['frontend/**', '.github/workflows/deploy-storybook.yml']
  # GitHub Actionsのページから手動で実行できるようにする
  workflow_dispatch:

# GITHUB_TOKEN のパーミッションを設定
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build Storybook
        run: npm run build-storybook --prefix frontend
        env:
          # GitHub Pagesのサブディレクトリ設定（例: /<リポジトリ名>/）
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
